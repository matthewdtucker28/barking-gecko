# Copy to pipeline/config.yml and edit. config.yml is git-ignored.

trim:
  input_root: /path/to/raw_recordings        # one top-level folder per recorder
  output_root: /path/to/trimmed_clips
  log_path: /path/to/logs/trim_log.csv
  clip_length_min: 10                        # each clip is the final N minutes before the hour
  target_hours: [19, 20, 21, 22]             # clip must end on one of these hours; null keeps every hour
  timestamp_regex: "\\d{8}_\\d{6}"           # where the start time sits in each filename
  timestamp_format: "%Y%m%d_%H%M%S"
  recorder_regex: "^[A-Za-z]+[0-9]+"         # matched against the top-level folder name

assign:
  trimmed_root: /path/to/trimmed_clips
  annotator_root: /path/to/annotator_assignments
  ledger_path: /path/to/logs/assignment_ledger.csv
  n_annotators: 6
  reference_night1_date: "2026-11-02"        # null puts clips directly in Annotator_N/ with no Night subfolders
  seed: null
